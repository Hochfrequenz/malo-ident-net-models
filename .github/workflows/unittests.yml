name: Unit Tests

on:
  push:
    branches:
      - "main"
  pull_request:
jobs:
  tests:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs#defining-the-maximum-number-of-concurrent-jobs
      matrix:
        dotnet_version: ["net10.0", "net11.0"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Run integration tests
        run: dotnet test MaLoIdentModelsTests/MaLoIdentModelsTests.csproj --framework ${{ matrix.dotnet_version }}
        working-directory: "MaLoIdentModels"
